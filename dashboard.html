<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배틀 대시보드 · Read Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  /* Shown full screen on the study room projector and read from the back of the room, so it takes the landing
     page's orange field and ink type instead of the working screens' light ground. */
  body { min-height: 100svh; background: var(--accent); color: var(--text); }
  .screen { --ink-soft: #5a2306; --ink-rule: rgba(5, 15, 22, 0.16); --track: #e8661a;
    width: min(100% - 64px, 1600px); margin-inline: auto; padding: 28px 0 32px; min-height: 100svh; display: grid; grid-template-rows: auto auto 1fr auto; gap: 24px; }
  .bar-top { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
  .bar-top .mark { font-size: 30px; }
  .bar-top .mark i { background: var(--text); width: 26px; height: 17px; }
  .bar-top .what { color: var(--ink-soft); font-size: 20px; font-weight: 600; }
  .bar-top .code { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; height: 56px; padding: 0 22px; background: var(--text); color: #fff; font-size: 17px; font-weight: 600; }
  .bar-top .code b { font-family: var(--display); font-weight: 400; color: var(--accent); font-size: 36px; letter-spacing: 0.08em; }
  .headline h1 { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 52px; letter-spacing: -0.005em; }
  .headline p { margin-top: 6px; color: var(--ink-soft); font-size: 19px; font-weight: 500; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 32px; align-items: stretch; min-height: 0; }
  .board, .board.card { display: flex; background: transparent; border: 0; padding: 0; }
  .board ol { flex: 1; display: grid; grid-auto-rows: minmax(72px, 1fr); }
  .board li { display: grid; grid-template-columns: 56px minmax(8rem, 15rem) auto minmax(0, 1fr) 110px; align-items: center; gap: 24px; padding: 0 20px; box-shadow: inset 0 1px 0 var(--ink-rule); font-size: 24px; }
  .board li:first-child { box-shadow: none; }
  .board li.lead { background: var(--text); color: #fff; }
  .board .d-rank { font-family: var(--display); font-size: 34px; line-height: 1; }
  .board li.lead .d-rank, .board li.lead b.num { color: var(--accent); }
  .board .who { font-size: 26px; font-weight: 600; gap: 14px; }
  .board .who i { width: 40px; height: 40px; font-size: 17px; background: rgba(255, 255, 255, 0.55); color: var(--text); }
  .board li.lead .who i { background: var(--accent); color: var(--text); }
  .board .strip { grid-auto-columns: 22px; gap: 4px; }
  .board .strip i { height: 22px; background: #c0601d; }
  .board .strip i.hi { background: var(--text); }
  .board .strip i.mid { background: #753f1a; }
  .board .strip i.miss { background: transparent; box-shadow: inset 0 0 0 2px #c0601d; }
  .board .strip i.miss::after { background: var(--text); width: 8px; margin-top: 10px; }
  .board .strip i.todo { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-rule); }
  .board .strip i.now { background: transparent; }
  .board .strip i.now { box-shadow: inset 0 0 0 3px var(--text); }
  .board li.lead .strip i { background: #5b3a22; }
  .board li.lead .strip i.hi { background: var(--accent); }
  .board li.lead .strip i.mid { background: #c0601d; }
  .board li.lead .strip i.miss { background: transparent; box-shadow: inset 0 0 0 2px #5b3a22; }
  .board li.lead .strip i.miss::after { background: #fff; }
  .board li.lead .strip i.todo { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.28); }
  .board li.lead .strip i.now { background: transparent; }
  .board li.lead .strip i.now { box-shadow: inset 0 0 0 3px #fff; }
  .board .bar { height: 12px; background: var(--track); }
  .board .bar > span, .board .bar.quiet > span { background: var(--text); }
  .board li.lead .bar { background: #2a333a; }
  .board li.lead .bar > span { background: var(--accent); }
  .board b.num { text-align: right; font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; }
  .side { display: grid; gap: 16px; grid-template-rows: auto auto 1fr; }
  .side .card { background: #fff; border: 0; }
  .side h2 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
  .side .script { font-size: 24px; line-height: 34px; font-weight: 500; }
  .side .missed { margin-top: 10px; color: var(--muted); font-size: 16px; }
  .side .rows li { font-size: 19px; min-height: 52px; }
  .side .rows b { font-family: var(--display); font-weight: 400; font-size: 24px; }
  .dots { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; margin-top: 4px; }
  .dots li { height: 48px; background: var(--raised); display: grid; place-items: center; font-family: var(--display); font-size: 20px; color: var(--faint); }
  .dots li.done { background: var(--text); color: #fff; }
  .dots li.now { background: var(--accent); color: var(--text); box-shadow: inset 0 0 0 3px var(--text); }
  .dots-note { margin-top: 12px; color: var(--muted); font-size: 17px; }
  .foot { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-soft); font-size: 17px; font-weight: 500; }
  .foot .strip-key { color: var(--ink-soft); font-size: 15px; }
  .foot .strip-key .strip i { background: #c0601d; } .foot .strip-key .strip i.hi { background: var(--text); } .foot .strip-key .strip i.mid { background: #753f1a; }
  .foot .strip-key .strip i.miss { background: transparent; box-shadow: inset 0 0 0 1.5px #c0601d; } .foot .strip-key .strip i.miss::after { background: var(--text); }
  @media (max-width: 1200px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .board li { grid-template-columns: 44px minmax(6rem, 12rem) auto minmax(0, 1fr) 90px; gap: 16px; }
  }
  @media (max-width: 640px) {
    .screen { width: min(100% - 32px, 1600px); padding-top: 16px; gap: 18px; }
    .bar-top { gap: 12px; }
    .bar-top .mark { font-size: 22px; }
    .bar-top .what { font-size: 15px; width: 100%; order: 3; }
    .bar-top .code { height: 44px; padding: 0 14px; } .bar-top .code b { font-size: 26px; }
    .headline h1 { font-size: 28px; line-height: 34px; }
    .headline p { font-size: 15px; }
    .board li { grid-template-columns: 28px minmax(0, 1fr) 64px; gap: 6px 12px; padding: 12px; font-size: 16px; }
    .board .d-rank { font-size: 24px; }
    .board .who { font-size: 18px; } .board .who i { width: 30px; height: 30px; font-size: 13px; }
    .board .strip { grid-column: 2 / 3; grid-row: 2; grid-auto-columns: 14px; } .board .strip i { height: 14px; } .board .strip i.miss::after { margin-top: 6px; width: 6px; }
    .board .bar { display: none; }
    .board b.num { font-size: 30px; grid-column: 3; grid-row: 1 / 3; }
    .foot { flex-direction: column; }
  }
</style>
</head>
<body data-page="dashboard">
<div class="screen">
  <div class="bar-top">
    <a class="mark" href="/" aria-label="Read Together 홈"><span>Read</span><i aria-hidden="true"></i><span>Together</span></a>
    <span class="what" id="d-what">불러오는 중</span>
    <span class="code" id="d-code-wrap" hidden>입장 코드 <b class="num" id="d-code">–</b></span>
  </div>

  <div class="headline">
    <h1 id="d-finding">–</h1>
    <p>제출할 때마다 순위가 바뀌어요. 라운드 점수는 정확도, 속도, 연속 정답을 더해요.</p>
  </div>

  <div class="body">
    <section class="card board" aria-label="이번 회차 순위">
      <ol class="rows" id="d-board"></ol>
    </section>
    <div class="side">
      <section class="card" aria-labelledby="d-prev-title">
        <h2 id="d-prev-title">정답</h2>
        <p class="script" lang="en" id="d-script">–</p>
        <p class="missed" id="d-missed"></p>
      </section>
      <section class="card" aria-labelledby="d-streak-title">
        <h2 id="d-streak-title">연속 정답 중</h2>
        <ul class="rows" id="d-streaks"></ul>
      </section>
      <section class="card" aria-labelledby="d-rounds-title">
        <h2 id="d-rounds-title">라운드</h2>
        <ol class="dots" id="d-dots"></ol>
        <p class="dots-note" id="d-dots-note"></p>
      </section>
    </div>
  </div>

  <div class="foot">
    <span>그룹 1등에게 커피 한 잔. 운영진이 확정한 점수는 누적 랭킹에 더해져요.</span>
    <span id="d-key"></span>
    <span id="d-absent"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
