<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>내 정보 · Read Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Black+Han+Sans&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
  .me-head { display: flex; align-items: center; gap: 16px; }
  .me-head .who i { width: 52px; height: 52px; font-size: 22px; }
  .quotes { display: grid; }
  .quotes li { display: grid; gap: 6px; padding: 16px 0; box-shadow: inset 0 1px 0 var(--rule); }
  .quotes li:first-child { box-shadow: none; padding-top: 2px; }
  .quotes blockquote { font-size: 17px; line-height: 26px; font-weight: 500; }
  .quotes .sub { color: var(--faint); font-size: 12px; }
  .quotes p.muted { font-size: 14px; }
  .rename { display: grid; gap: 12px; }
  .rename-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .next h3 { font-size: 16px; font-weight: 600; line-height: 22px; }
  .next p { margin-top: 4px; color: var(--muted); }
  .next .btn { margin-top: 14px; }
  .gate { max-width: 32rem; display: grid; gap: 14px; }
  .gate h2 { font-size: 17px; font-weight: 600; }
  .stack-lg { display: grid; gap: 24px; }
  #battles-key { margin-top: 14px; }
  @media (max-width: 640px) {
    #battles th:nth-child(2), #battles td:nth-child(2) { display: none; }
  }
</style>
</head>
<body data-page="me">
<header class="topbar">
  <div class="column">
    <a class="mark" href="/" aria-label="Read Together 홈"><span>Read</span><i aria-hidden="true"></i><span>Together</span></a>
    <nav class="topnav" aria-label="주 메뉴">
      <a href="/sessions">회차</a>
      <a href="/ranking">랭킹</a>
      <a href="/battle">배틀</a>
    </nav>
    <div class="end"><a href="/">소개</a><span class="account" data-account><a href="https://docs.google.com/forms/d/e/1FAIpQLSeUK2l8nBtd7qEa8zQUbEIgW0TBEwaIMR9y7j-i5d9013xdkg/viewform?usp=header">신청하기</a></span></div>
    <details class="menu"><summary>메뉴</summary><nav aria-label="주 메뉴"><a href="/sessions">회차</a><a href="/ranking">랭킹</a><a href="/battle">배틀</a><a href="/">소개</a><div class="account" data-account><a href="https://docs.google.com/forms/d/e/1FAIpQLSeUK2l8nBtd7qEa8zQUbEIgW0TBEwaIMR9y7j-i5d9013xdkg/viewform?usp=header">신청하기</a></div></nav></details>
  </div>
</header>

<main class="column">
  <div class="title-row">
    <div class="me-head">
      <span id="me-face"></span>
      <div>
        <h1 id="me-title">내 정보</h1>
        <p class="sub" id="me-sub">불러오는 중이에요.</p>
      </div>
    </div>
  </div>

  <section class="card gate" id="me-gate" hidden aria-labelledby="gate-title">
    <h2 id="gate-title">로그인이 필요해요</h2>
    <p class="muted" id="gate-text">신청할 때 적은 휴대폰 번호로 로그인하면 내 참여 기록과 점수를 볼 수 있어요.</p>
    <div><button type="button" class="btn btn-primary" data-login>로그인</button></div>
  </section>

  <div id="me-body" class="stack-lg" hidden>
    <dl class="kpi" id="me-kpis" style="--cells:4"></dl>

    <div class="with-rail">
      <div class="stack">
        <section class="card" aria-labelledby="battles-title">
          <div class="card-head"><h2 id="battles-title">내 배틀 기록</h2><span class="meta">운영진이 확정한 점수</span></div>
          <div class="table-frame">
            <table class="data" id="battles">
              <thead><tr><th>회차</th><th>날짜</th><th>라운드</th><th class="r">점수</th><th class="r">그룹 순위</th><th class="r"><span class="sr-only">1등</span></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="battles-key"></div>
        </section>
        <section class="card" aria-labelledby="said-title">
          <div class="card-head"><h2 id="said-title">내가 남긴 문장</h2><span class="meta" id="said-meta"></span></div>
          <ul class="quotes" id="said"></ul>
        </section>
      </div>

      <aside class="rail" aria-label="내 설정과 일정">
        <h2>다음 모임</h2>
        <div class="card next" id="me-next"></div>
        <h2>이름 바꾸기</h2>
        <form class="card rename" id="rename" novalidate>
          <div class="field">
            <label for="me-name">표시 이름</label>
            <input class="input" id="me-name" maxlength="20" autocomplete="nickname">
          </div>
          <p class="muted" style="margin:0;font-size:13px">랭킹, 대시보드, 남긴 문장에 이 이름으로 보여요. 20자까지, 다른 멤버와 같은 이름은 쓸 수 없어요.</p>
          <div class="rename-foot"><button type="submit" class="btn btn-primary">이름 저장</button><p class="muted" id="rename-msg" role="status"></p></div>
        </form>
        <h2>참여한 회차</h2>
        <div class="card"><ul class="rows" id="me-came"></ul></div>
      </aside>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
